name: SelfieTNN
options:
  bundleIdPrefix: com.apptnn
  deploymentTarget:
    iOS: "17.0"
targets:
  SelfieTNN:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SelfieTNN
        NSCameraUsageDescription: Used to take selfies and record videos.
        NSMicrophoneUsageDescription: Used to record audio with your videos.
        NSPhotoLibraryAddUsageDescription: Used to save your selfies to Photos.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apptnn.SelfieTNN
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
